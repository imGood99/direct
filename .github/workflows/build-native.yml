name: build-native
on: [push, workflow_dispatch]
jobs:
  ndk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ndk-build
        run: |
          cd native
          $ANDROID_NDK_LATEST_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
      - uses: actions/upload-artifact@v4
        with:
          name: libfastgyro
          path: native/libs
          
